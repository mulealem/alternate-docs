# Serves the static Docusaurus export (build/) copied in by the Dockerfile.
#
# Listens on BOTH 80 and 8080 on purpose: Coolify's Application default
# port is 80, but this repo's compose file and docs also use 8080.
# Listening on both means the deploy works with either Port value.
server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docusaurus emits pretty URLs (/quickstart/) plus hashed assets
    # under /assets/. Serve directory indexes, then fall back to a
    # clean 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Long-cache static assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hide nginx version in error pages.
    server_tokens off;
}
