# Serves the static Docusaurus export (build/) built by the Dockerfile.
# Listens on 8080; Coolify terminates TLS.
server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docusaurus emits clean pretty URLs (/docs/page/) but also a few
    # hashed assets; this try_files chain serves the directory index
    # when present and falls back to a clean 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Long-cache static assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
