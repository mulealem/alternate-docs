name: pygate-alternate-docs

services:
  docs:
    build: .
    container_name: pygate-alternate-docs
    restart: unless-stopped
    ports:
      - "3004:8080"
    environment:
      - DOCS_URL=https://alt-docs.payment.et
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
